<ui:composition
        xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
        xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
        xmlns:fn="http://xmlns.jcp.org/jsp/jstl/functions"
        xmlns:f="http://xmlns.jcp.org/jsf/core"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:p="http://primefaces.org/ui"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:timing="http://kitodo.org/timing">

    <p:outputPanel styleClass="thumbnail-parent" >
        <!-- =========================================================
       1. SELECTION / STYLE REGION
       ========================================================= -->
        <timing:timingPanel
                id="selectionRenderTimer"
                label="media-list-selection"
                aggregate="true"
                expectedCount="#{DataEditorForm.galleryPanel.stripes.getFirst().medias.size()}">
        <c:choose>
            <c:when test="#{uiParamStripeIndex eq '0' || uiParamStripeIndex eq 0}">
                <c:set var="thumbnailStyleClass"
                       value="#{DataEditorForm.galleryPanel.isSelected(media, DataEditorForm.galleryPanel.stripes.getFirst()) ? 'selected' : ''} #{DataEditorForm.galleryPanel.isLastSelection(media, DataEditorForm.galleryPanel.stripes.get(0)) ? 'last-selection' : ''}"/>
            </c:when>
            <c:otherwise>
                <c:set var="thumbnailStyleClass"
                       value="#{DataEditorForm.galleryPanel.isSelected(media, stripe) ? 'selected' : ''} #{DataEditorForm.galleryPanel.isLastSelection(media, stripe) ? 'last-selection' : ''}"/>
            </c:otherwise>
        </c:choose>
        <p:outputPanel
                styleClass="thumbnail #{DataEditorForm.consecutivePagesSelected() ? '' : 'discontinuous'} #{thumbnailStyleClass}"/>
        </timing:timingPanel>

        <!-- =========================================================
             thumbnail-container itself stays OUTSIDE the timers
             ========================================================= -->
        <p:outputPanel styleClass="thumbnail-container #{fn:startsWith(media.previewMimeType, 'video') ? 'media-type-video' : ''}#{fn:startsWith(media.previewMimeType, 'audio') ? 'media-type-audio' : ''}"
                       a:data-order="#{media.order}"
                       a:data-stripe="#{uiParamStripeIndex}"
                       a:data-logicalTreeNodeId="#{media.logicalTreeNodeId}">
            <!-- =====================================================
          2. PREVIEW / MEDIA REGION
          ===================================================== -->


            <timing:timingPanel
                    id="previewRenderTimer"
                    label="media-list-preview"
                    aggregate="true"
                    expectedCount="#{DataEditorForm.galleryPanel.stripes.getFirst().medias.size()}">
            <ui:fragment
                    rendered="#{mediaProvider.hasPreviewVariant(media) and (fn:startsWith(media.previewMimeType, 'video') or fn:startsWith(media.previewMimeType, 'audio'))}">
                <p:video styleClass="mediaListItem"
                         rendered="#{fn:startsWith(media.previewMimeType, 'video')}"
                         player="#{media.previewMimeType.substring(media.previewMimeType.lastIndexOf('/') + 1)}"
                         controls="true"
                         value="#{mediaProvider.previewData}">
                    <f:param name="mediaId"
                             value="#{media.id}"/>
                    <f:param name="process"
                             value="#{DataEditorForm.process.id}"/>
                    <f:param name="sessionId"
                             value="#{DataEditorForm.galleryPanel.cachingUUID}"/>
                    <f:param name="type"
                             value="#{media.previewMimeType}"/>
                    <f:param name="krsc"
                             value="true"/>
                </p:video>
                <p:audio styleClass="mediaListItem"
                         rendered="#{fn:startsWith(media.previewMimeType, 'audio')}"
                         player="#{fn:endsWith(media.previewMimeType, 'mpeg') ? 'mp3' : media.previewMimeType.substring(media.previewMimeType.lastIndexOf('/') + 1)}"
                         controls="true"
                         value="#{mediaProvider.previewData}">
                    <f:param name="mediaId"
                             value="#{media.id}"/>
                    <f:param name="process"
                             value="#{DataEditorForm.process.id}"/>
                    <f:param name="sessionId"
                             value="#{DataEditorForm.galleryPanel.cachingUUID}"/>
                    <f:param name="type"
                             value="#{media.previewMimeType}"/>
                    <f:param name="krsc"
                             value="true"/>
                </p:audio>
            </ui:fragment>

            <ui:fragment rendered="#{mediaProvider.hasPreviewVariant(media) and fn:startsWith(media.previewMimeType, 'image')}">
                <h:outputText>
                    <timing:timingPanel
                            id="graphicImageRenderTimer"
                            label="media-list-graphic-image"
                            aggregate="true"
                            expectedCount="#{DataEditorForm.galleryPanel.stripes.getFirst().medias.size()}">

                    <!-- only render those pages that are not assigned to a stripe (structure) here! -->
                    <p:graphicImage styleClass="mediaListItem" value="#{mediaProvider.previewData}"
                                    a:loading="lazy">
                        <f:param name="mediaId"
                                 value="#{media.id}"/>
                        <f:param name="process"
                                 value="#{DataEditorForm.process.id}"/>
                        <f:param name="sessionId"
                                 value="#{DataEditorForm.galleryPanel.cachingUUID}"/>
                    </p:graphicImage>
                    </timing:timingPanel>
                </h:outputText>
                <h:outputText value="#{DataEditorForm.galleryPanel.getSeveralAssignmentsIndex(media) + 1}"
                              rendered="#{media.assignedSeveralTimes}"
                              styleClass="assigned-several-times"/>
            </ui:fragment>

            <ui:fragment rendered="#{not mediaProvider.hasPreviewVariant(media)}">
                <p:outputPanel styleClass="mediaListIconItem" >
                    <h:panelGroup rendered="#{media.type eq 'VIDEO'}">
                        <i class="fa fa-file-video-o"/>
                    </h:panelGroup>
                    <h:panelGroup rendered="#{media.type eq 'AUDIO'}">
                        <i class="fa fa-file-audio-o"/>
                    </h:panelGroup>
                    <h:panelGroup rendered="#{media.type eq 'IMAGE'}">
                        <i class="fa fa-file-image-o"/>
                    </h:panelGroup>
                </p:outputPanel>
                <h:outputText value="#{DataEditorForm.galleryPanel.getSeveralAssignmentsIndex(media) + 1}"
                              rendered="#{media.assignedSeveralTimes}"
                              styleClass="assigned-several-times"/>
            </ui:fragment>
            </timing:timingPanel>
            <timing:timingPanel
                    id="contentRenderTimer"
                    label="media-list-content"
                    aggregate="true"
                    expectedCount="#{DataEditorForm.galleryPanel.stripes.getFirst().medias.size()}">

            <ui:include src="media-list-content.xhtml"/>
            </timing:timingPanel>

        </p:outputPanel>
        
        <ui:fragment rendered="#{LoginForm.loggedUser.isShowPhysicalPageNumberBelowThumbnail()}">
            <p:outputPanel class="thumbnail-banner physical">
                <h:outputText rendered="#{media.type eq 'VIDEO'}">
                    #{msgs.video} #{media.shortId}
                </h:outputText>
                <h:outputText rendered="#{media.type eq 'AUDIO'}">
                    #{msgs.audio} #{media.shortId}
                </h:outputText>
                <h:outputText rendered="#{media.type eq 'IMAGE'}">
                    #{msgs.image} #{media.shortId}
                </h:outputText>
            </p:outputPanel>
        </ui:fragment>
        <ui:fragment rendered="#{LoginForm.loggedUser.isShowLogicalPageNumberBelowThumbnail()}">
            <p:outputPanel class="thumbnail-banner logical">
                <h:outputText>
                        #{msgs.page} #{media.orderlabel}
                </h:outputText>
            </p:outputPanel>
        </ui:fragment>
    </p:outputPanel>

</ui:composition>
