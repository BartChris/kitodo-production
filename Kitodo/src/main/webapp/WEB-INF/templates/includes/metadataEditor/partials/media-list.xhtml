<ui:composition
        xmlns:p="http://primefaces.org/ui"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <p:outputPanel styleClass="thumbnail-parent">
        <div class="test-thumbnail
                    #{media.selectedInUnstructuredStripe ? 'selected' : ''}
                    #{media.lastSelectionInUnstructuredStripe ? 'last-selection' : ''}"
             data-order="#{media.order}"
             data-id="#{media.id}">

            <img
                    class="mediaListItem"
                    src="#{media.previewUrl}"
                    loading="lazy"
                    alt="" />

            <div class="thumbnail-overlay">
                <span class="overlay-text">
                    #{media.normalOverlayText}
                </span>
                <span class="multiple-assignment #{media.showAssignmentIndex ? '' : 'hidden'}">
                    #{media.assignmentIndex}
                </span>
            </div>
        </div>

        <div class="thumbnail-banner physical #{media.showPhysicalPageNumber ? '' : 'hidden'}">
            #{media.physicalPageNumber}
        </div>

        <div class="thumbnail-banner logical #{media.showLogicalPageNumber ? '' : 'hidden'}">
            #{media.logicalPageNumber}
        </div>
    </p:outputPanel>
</ui:composition>
