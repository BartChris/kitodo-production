name: CI

on:
  push:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: browser diagnostics
        run: |
          echo "Chrome:"
          google-chrome --version || true

          echo "Chromedriver:"
          chromedriver --version || true

          echo "Location:"
          which chromedriver || true

      - name: install imagemagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - uses: actions/checkout@v6

      - name: copy files
        run: |
          cp $GITHUB_WORKSPACE/config/database.yml.actions $GITHUB_WORKSPACE/config/database.yml
          cp $GITHUB_WORKSPACE/Kitodo-DataManagement/src/main/resources/db/config/flyway.properties.actions \
             $GITHUB_WORKSPACE/Kitodo-DataManagement/src/main/resources/db/config/flyway.properties

      - name: start mysql
        run: sudo service mysql start

      - name: check MySQL version
        run: mysql --version

      - name: create database
        run: mysql -u root -proot -e 'CREATE DATABASE kitodo;'

      - name: setup database
        run: |
          mysql -u root -proot -e "CREATE USER 'kitodo'@'localhost' IDENTIFIED BY 'kitodo';"
          mysql -u root -proot -e "GRANT ALL ON kitodo.* TO 'kitodo'@'localhost';"

      - name: import schema
        run: mysql -u root -proot kitodo < $GITHUB_WORKSPACE/Kitodo/setup/schema.sql

      - name: import default
        run: mysql -u root -proot kitodo < $GITHUB_WORKSPACE/Kitodo/setup/default.sql

      - name: set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'adopt'

      - name: check java version
        run: java --version

      - name: check maven version
        run: mvn --version

      - name: run build
        run: |
          mvn clean install -B '-Pall-tests,flyway,checkstyle,!development' &&
          xvfb-run --server-args="-screen 0 1600x1280x24" \
            mvn clean install -B '-Pselenium,!development'